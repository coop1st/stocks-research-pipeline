name: Weekly price fetch

# Runs entirely in the cloud -- no local machine needed. Fetches a fixed
# trailing window of prices for the whole universe (see
# cloud/fetch_weekly_prices.py for why this can't use the DB-diffing
# incremental logic the local pipeline uses) and commits the result as a
# small dated CSV. The local pipeline picks this up later, whenever that
# machine is next on, and merges it into the real historical database.

on:
  schedule:
    # Saturday 03:00 UTC. The local weekly job fires at 11:00am Irish
    # wall-clock time, which is 10:00 UTC in IST (Mar-Oct) or 11:00 UTC in
    # GMT (Oct-Mar) -- this runs 7-8 hours ahead of the earlier of those
    # two, so the cloud snapshot is reliably ready before the local job's
    # `git pull` picks it up. (Originally this ran at 13:00 UTC, which was
    # actually *after* the local job when that job ran at 8am -- fixed.)
    - cron: "0 3 * * 6"
  workflow_dispatch: {}  # allows manual triggering from the Actions tab / gh CLI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch weekly prices
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python cloud/fetch_weekly_prices.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github_sync/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly price data: $(date -u +%Y-%m-%d)"
            git push
          fi
